{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto p-8 bg-white shadow-lg rounded-xl">
    <h1 class="text-3xl font-bold mb-6">Contact Us</h1>
    <form action="{% url 'contact' %}" method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-right pt-2">
            <button class="px-4 py-2 bg-red-500 text-white rounded-xl">
                Send
            </button>
        </div>
    </form>
</div>
{% endblock %}
